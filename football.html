<!-- ADD THIS IN YOUR HEADER -->
<button onclick="openGame()" style="background:#00ff88;border:none;padding:8px 12px;border-radius:8px;font-weight:bold;cursor:pointer">
  ⚽ PLAY FOOTBALL
</button>

<!-- ADD THIS AT BOTTOM OF BODY, before </body> -->
<div id="gameModal" style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.9);z-index:9999;justify-content:center;align-items:center;flex-direction:column">
  <button onclick="closeGame()" style="background:#ff4444;color:#fff;margin:10px">✕ CLOSE GAME</button>
  <iframe id="gameFrame" src="football.html" style="width:360px;height:550px;border:3px solid #fff;border-radius:15px;background:#0a5c26"></iframe>
</div>

<script>
function openGame(){ document.getElementById('gameModal').style.display='flex'; }
function closeGame(){ document.getElementById('gameModal').style.display='none'; }
</script>
